# Aff Bazaar — конфиг до выпуска сертификата. Рендерится entrypoint.sh, __DOMAIN__ подставляется из .env.
# Правки делать здесь, потом `make nginx` (перечитать) — файл внутри контейнера генерируется.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # проверка владения доменом для Let's Encrypt (том certbot-webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        resolver 127.0.0.11 valid=10s;     # DNS Docker: переживает перезапуск контейнера бота
        set $upstream http://bot:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
