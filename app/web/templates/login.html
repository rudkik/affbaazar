<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_title}} — вход в админку</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/static/site.webmanifest?v=2">
<meta name="theme-color" content="#1c2540">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Aff Bazar: та же система токенов, что на ленте и в админке ---- */
    --bg:#fbf5e8; --dots:rgba(28,37,64,.07);
    --card:#ffffff; --field:#fbf5e8;
    --stroke:#1c2540; --line:#e6dcc4; --shadow-c:#1c2540;
    --text:#1c2540; --text2:#3d4459; --muted:#6b6a63; --faint:#8c8a80;
    --yellow:#f5b81c; --red:#b8262b; --red-hover:#8f1a1f; --green:#2ba05a;
    --red-text:#b8262b; --stripe-1:#1c2540;
    --btn-p-bg:#1c2540; --btn-p-fg:#f5b81c;
    --font-head:'Rubik',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-body:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141a2e; --dots:rgba(255,255,255,.06);
      --card:#1c2540; --field:#232c4a;
      --stroke:#3a4670; --line:#3a4670; --shadow-c:#0b0f1c;
      --text:#f6efe0; --text2:#ded7c6; --muted:#a9a48f; --faint:#7d7a6c;
      --yellow:#f5b81c; --red:#e0484e; --red-hover:#ff9296; --green:#3fc27a;
      --red-text:#ff8a8e; --stripe-1:#f6efe0;
      --btn-p-bg:#f5b81c; --btn-p-fg:#141a2e;
    }
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:clip}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:56px 20px 32px;
       background:var(--bg);
       background-image:radial-gradient(var(--dots) 1px, transparent 1px);
       background-size:22px 22px;
       color:var(--text);
       font:15px/1.55 var(--font-body)}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:2;
       background:linear-gradient(90deg,var(--stripe-1) 0 33%,#f5b81c 33% 66%,#b8262b 66%)}
  a{color:var(--red-text)}
  a:hover{color:var(--red-hover);text-decoration:underline}

  form{background:var(--card);border:2px solid var(--stroke);border-radius:18px;
       padding:24px 22px 22px;width:min(380px,100%);box-shadow:5px 5px 0 var(--shadow-c)}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo-box{flex:none;width:64px;height:64px;border-radius:16px;background:#fff;
       border:2px solid var(--stroke);box-shadow:3px 3px 0 var(--shadow-c);
       display:flex;align-items:center;justify-content:center;overflow:hidden}
  .logo-box img{width:56px;height:56px;object-fit:contain;display:block}
  .wordmark{margin:0;font-family:var(--font-head);font-weight:900;font-size:24px;
       line-height:1.05;letter-spacing:-.5px;color:var(--text);overflow-wrap:anywhere}
  .tagline{margin:5px 0 0;font-size:13px;font-weight:700;color:var(--muted)}

  label{display:block;font-family:var(--font-head);font-weight:700;font-size:12px;
        text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
  input{width:100%;height:48px;padding:0 14px;border-radius:12px;font-size:16px;font-weight:700;
        font-family:var(--font-body);border:2px solid var(--line);background:var(--field);
        color:var(--text)}
  input::placeholder{color:var(--faint)}
  input:focus{outline:none;border-color:var(--yellow)}
  input:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
  button{margin-top:16px;width:100%;height:48px;padding:0 16px;border-radius:12px;
         border:2px solid var(--stroke);background:var(--btn-p-bg);color:var(--btn-p-fg);
         font-family:var(--font-head);font-weight:700;font-size:15px;cursor:pointer;
         box-shadow:3px 3px 0 var(--shadow-c);transition:transform .08s ease,box-shadow .08s ease}
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow-c)}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow-c)}
  button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .err{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:800;
       color:#fff;background:var(--red);border:2px solid var(--stroke)}
  .back{display:block;margin-top:18px;text-align:center;font-size:14px;font-weight:800;
        color:var(--red-text);text-decoration:none}
  .back:hover{color:var(--red-hover);text-decoration:underline}
  @media (max-width: 420px){
    .logo-box{width:52px;height:52px;border-radius:14px}
    .logo-box img{width:44px;height:44px}
    .wordmark{font-size:20px}
  }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <div class="brand">
    <span class="logo-box"><img src="{{logo_url}}" width="56" height="56" alt="{{site_title}}"></span>
    <div>
      <h1 class="wordmark">{{site_title}}</h1>
      <p class="tagline">Вход в админку</p>
    </div>
  </div>
  <label for="password">Пароль</label>
  <input id="password" type="password" name="password" autofocus autocomplete="current-password">
  <button type="submit">Войти</button>
  <div class="err" id="err" hidden>Неверный пароль</div>
  <a class="back" href="/">← к ленте объявлений</a>
</form>
<script>
if (new URLSearchParams(location.search).get('e')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
