<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_title}} — вход в админку</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#4c46d9">
<style>
  :root{
    /* ---- Aff Bazar: та же система токенов, что на ленте и в админке ---- */
    --bg:#f6f4ef; --card:#ffffff; --line:#e7e2d5; --line-strong:#d8d0bd;
    --text:#1d1a15; --muted:#6d6355; --faint:#9a8f7a;
    --accent:#4c46d9; --accent-weak:#edecfc; --accent-contrast:#ffffff;
    --accent2:#a8660a;
    --bad:#c1392b; --bad-weak:#fbe8e5;
    --shadow:0 1px 2px rgba(30,24,10,.06),0 3px 12px rgba(30,24,10,.05);
    --radius:14px; --radius-sm:9px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121119; --card:#1c1b25; --line:#2b2937; --line-strong:#3a3849;
      --text:#efece3; --muted:#a79c89; --faint:#766c5c;
      --accent:#8d86ff; --accent-weak:#24213c; --accent-contrast:#14122a;
      --accent2:#e3aa55;
      --bad:#ff7263; --bad-weak:#3a1a16;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 3px 14px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .wordmark{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
  .accent-part{background:linear-gradient(120deg,var(--accent),var(--accent2));
               -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{margin:2px 0 0;font-size:13px;color:var(--muted)}
  form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       padding:26px;width:min(360px,100%);box-shadow:var(--shadow)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,button{width:100%;padding:12px 13px;border-radius:var(--radius-sm);font-size:15px;
       font-family:inherit;border:1px solid var(--line-strong);background:var(--bg);
       color:var(--text);min-height:44px}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{margin-top:14px;background:var(--accent);border-color:var(--accent);
         color:var(--accent-contrast);font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.07)}
  .err{margin-top:12px;padding:9px 11px;border-radius:var(--radius-sm);font-size:13px;
       color:var(--bad);background:var(--bad-weak);border:1px solid var(--bad)}
  .back{display:block;margin-top:16px;text-align:center;font-size:13px;color:var(--muted);
        text-decoration:none}
  .back:hover{color:var(--accent)}
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <div class="brand">
    <img src="{{logo_url}}" width="34" height="34" alt="{{site_title}}"
         style="flex:none;width:34px;height:34px;object-fit:contain">
    <div>
      <h1 class="wordmark">{{site_title}}</h1>
      <p class="tagline">Вход в админку</p>
    </div>
  </div>
  <label for="password">Пароль</label>
  <input id="password" type="password" name="password" autofocus autocomplete="current-password">
  <button type="submit">Войти</button>
  <div class="err" id="err" hidden>Неверный пароль</div>
  <a class="back" href="/">← к ленте объявлений</a>
</form>
<script>
if (new URLSearchParams(location.search).get('e')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
