# Aff Bazaar: бот + сайт в одном контейнере. Наружу (https://affbazaar.com) его отдаёт Caddy
# из соседнего проекта affbiz: бот подключается к его Docker-сети, Caddy проксирует на affbazaar-bot:8080.
# Настройка Caddy — `make caddy`. Переменные ${BOT_PORT}, ${CADDY_NETWORK} берутся из .env.

# Имя проекта фиксируем, чтобы сеть и тома не зависели от имени папки и не пересекались с соседними стеками.
name: affbazaar

services:
  bot:
    build: .
    image: affbazaar-bot
    container_name: affbazaar-bot   # по этому имени к боту ходит Caddy: reverse_proxy affbazaar-bot:8080
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080            # порт внутри контейнера, менять не нужно
    # Наружу только на localhost — для проверок (make health) и на случай прокси на хосте.
    # 8081, чтобы не пересекаться с affbiz на 8080.
    ports:
      - "127.0.0.1:${BOT_PORT:-8081}:8080"
    networks:
      - default
      - caddy
    volumes:
      - affbazaar-data:/app/data  # базы bot.db / site.db и логи — Docker-том, переживает пересборку
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default: {}
  caddy:
    # Сеть, в которой живёт Caddy (сеть compose-проекта affbiz). Создаётся не нами;
    # если её нет — `make network` создаст, но тогда Caddy надо подключить к ней вручную.
    name: ${CADDY_NETWORK:-affbiz_default}
    external: true

volumes:
  affbazaar-data:    # bot.db, site.db, logs/ — бэкап: make backup, восстановление: make restore
